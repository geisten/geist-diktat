name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      matrix:
        # -std=c23 needs gcc >= 14; force the generic linux target — the
        # GitHub arm runners otherwise auto-detect as pi5 (cortex-a76).
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update -q && sudo apt-get install -y -q libopenblas-dev gcc-14
      - name: build
        run: make CC=gcc-14 TARGET=linux
      - name: smoke test (fixture-gated half skips without the 3.7 GB model)
        run: make CC=gcc-14 TARGET=linux test

  musl-tarball:
    # The Linux tarball is linked fully static against musl, so it must be built
    # and proven per PR — the release job is not the place to find out that the
    # one artifact claiming "runs on any distro" does not.
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Alpine 3.21 is what geistlib uses for its own musl-static artifact:
      # gcc 14 for -std=c23, musl-built libgomp for OpenMP.
      - name: build + package (alpine 3.21, musl-static)
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine:3.21 sh -ec '
            # tar: busybox's lacks the determinism flags build-tarball.sh uses.
            apk add --no-cache build-base linux-headers git tar >/dev/null
            git config --global --add safe.directory /w
            make TARGET=linux CC=gcc GEMM_PROVIDER=native EXTRA_LDFLAGS=-static
            make tarball
            # Packaged twice from the same binary: nothing that varies per run
            # (mtimes, uid/gid, file order, the gzip header) may reach the
            # archive. Only the packaging repeats — a second full compile would
            # double the job to re-prove a step that did not change.
            cp geist-diktat_*_linux-*.tar.gz /tmp/first.tar.gz
            make tarball
            cmp /tmp/first.tar.gz geist-diktat_*_linux-*.tar.gz
            echo "reproducible: byte-identical across two packaging runs"
          '
      # On the glibc host: a static binary that only runs where it was built
      # would defeat the point. build-tarball.sh already asserted no dynamic
      # section; this asserts it actually executes elsewhere.
      - name: runs on glibc, unpacked
        run: |
          mkdir -p /tmp/tb && tar -C /tmp/tb -xzf geist-diktat_*_linux-*.tar.gz
          /tmp/tb/geist-diktat_*/bin/geist-diktat 2>&1 | grep -q usage
          /tmp/tb/geist-diktat_*/bin/diktat /nonexistent.gguf </dev/null 2>&1 | grep -q "model_load failed"
          file /tmp/tb/geist-diktat_*/bin/diktat

  macos-build:
    # Apple Silicon only — geistlib's mac targets are cpu_neon.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The image default is Xcode 16.4, whose Apple clang only knows -std=c2x
      # while geistlib builds with -std=c23 — that cost a red job once already.
      # Pinned rather than "newest on the image": newest would just as readily
      # hand us a beta, and a toolchain that changes under the build is the
      # same class of problem as an engine pin that is not enforced. When the
      # image drops this version the job stops with the list of what it does
      # have, so the bump is a decision instead of a surprise.
      - name: select the pinned Xcode
        run: |
          XCODE=/Applications/Xcode_26.3.app
          [ -d "$XCODE" ] || {
            echo "pinned $XCODE is gone from this image; available:" >&2
            ls -d /Applications/Xcode_*.app >&2
            exit 1
          }
          sudo xcode-select -s "$XCODE"
          cc --version | head -1   # recorded in the log: what actually built
      - name: deps
        run: brew install libomp
      - name: build (static libomp, as the release tarball does)
        run: make GEIST_STATIC_OMP=1
      - name: smoke test (fixture-gated half skips without the 3.7 GB model)
        run: make test
      - name: tarball builds and the wrapper resolves its prefix
        run: |
          make tarball
          mkdir -p /tmp/tb && tar -C /tmp/tb -xzf geist-diktat_*_macos-*.tar.gz
          /tmp/tb/geist-diktat_*/bin/geist-diktat 2>&1 | grep -q usage

  nvim-plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update -q && sudo apt-get install -y -q neovim
      - name: headless plugin test (diktat stubbed)
        run: make test-nvim

  ibus-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-14 libibus-1.0-dev ibus dbus
      - name: build engine + test client
        run: make CC=gcc-14 GEMM_PROVIDER=native ibus
      - name: headless integration test (daemon + engine + client)
        run: make test-ibus

  install-sh:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: syntax
        run: sh -n install.sh
      - name: one-liner against the latest release, clean container
        run: |
          docker run --rm -v "$PWD/install.sh:/install.sh:ro" ubuntu:24.04 bash -ec '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q >/dev/null && apt-get install -y -q curl ca-certificates >/dev/null
            sh /install.sh
            geist-diktat 2>&1 | grep -q usage
            echo "install.sh ok"
          '

  deb:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update -q && sudo apt-get install -y -q lintian
      - name: build (packaging/build-linux.sh — shared with release.yml)
        run: |
          [ "$(uname -m)" = aarch64 ] || sudo apt-get install -y -q gcc-14 libibus-1.0-dev
          sh packaging/build-linux.sh
      - name: package
        run: make deb
      - name: lintian (errors fail; style warnings tolerated)
        run: lintian --fail-on error geist-diktat_*.deb
      - name: install test in clean containers (catches missing Depends; bookworm = RasPiOS glibc)
        run: |
          IMAGES="ubuntu:24.04"
          [ "$(uname -m)" = aarch64 ] && IMAGES="$IMAGES debian:12"
          for IMG in $IMAGES; do
          echo "=== $IMG ==="
          docker run --rm -v "$PWD:/w" -w /w "$IMG" bash -ec '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q >/dev/null
            apt-get install -y -q ./geist-diktat_*.deb >/dev/null
            geist-diktat 2>&1 | grep -q usage
            diktat /nonexistent.gguf </dev/null 2>&1 | grep -q "model_load failed"
            ls /usr/share/ibus/component/geist-diktat.xml /usr/libexec/ibus-engine-geist-diktat >/dev/null
            # runtime deps must arrive via Depends — a fresh container has none preinstalled
            command -v arecord >/dev/null || { echo "FAIL: alsa-utils not pulled in"; exit 1; }
            command -v curl >/dev/null || { echo "FAIL: curl not pulled in"; exit 1; }
            echo "container install ok"
          '
          done
      - uses: actions/upload-artifact@v4
        with:
          name: geist-diktat-deb-${{ matrix.runner }}
          path: geist-diktat_*.deb
