name: quality-audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-14 clang-18 llvm-18 make pkg-config libibus-1.0-dev ibus dbus python3 neovim vim ca-certificates libgtk-3-dev qtbase5-dev g++ xvfb xauth xdotool ibus-gtk3
      - name: Pinned engine headers
        run: |
          git clone --quiet https://github.com/geisten/geistlib.git geistlib
          git -C geistlib checkout --detach bb751c596f7d6ed3f73fa2d4c4e29e617cada57f
      - name: Regression contracts and real isolated GTK / Qt / IBus
        run: sh tests/ubuntu.sh
      - name: LLVM core coverage, including failing cases
        if: always()
        env:
          CC: clang-18
          LLVM_COV: llvm-cov-18
          LLVM_PROFDATA: llvm-profdata-18
        run: sh tests/coverage.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-audit-${{ matrix.runner }}
          path: tests/results/
          retention-days: 30

  speech-cpu:
    # Uses the existing Ubuntu/Linux agent and its pinned model cache. No IBus
    # restart, microphone capture or modification of its live desktop session.
    runs-on: [self-hosted, amd-desktop]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned CPU engine
        run: make CC=gcc-14 TARGET=linux GEMM_PROVIDER=native
      - name: Check cached model and audio conversion tool
        run: |
          test -f "$HOME/.local/share/geist-diktat/gemma4-e2b-Q4_K_M.gguf"
          test -f "$HOME/.local/share/geist-diktat/audio_tower.safetensors"
      - name: Prepare public German read-speech pilot
        run: python3 benchmarks/prepare_quality.py --fleurs-only
      - name: Measure real-model German WER and CPU performance
        run: |
          python3 benchmarks/quality.py \
            --manifest build/speech-corpus/manifest.json --binary ./diktat \
            --model "$HOME/.local/share/geist-diktat/gemma4-e2b-Q4_K_M.gguf" \
            --tower "$HOME/.local/share/geist-diktat/audio_tower.safetensors" \
            --mel geistlib/audio_test_data/mel_constants.bin --groups de-read-clean --limit 2 --timeout 240 \
            --output build/speech-results/ubuntu-agent-quality.json
      - name: Compare temporary x86 backend selection candidate
        if: always()
        run: |
          sed 's/"cpu_neon"/"cpu_x86"/' src/diktat.c > build/diktat-x86-probe.c
          gcc-14 -std=c23 -O2 -Igeistlib/include -march=x86-64-v3 -fopenmp -ffast-math -D_GNU_SOURCE -DGEIST_GEMM_NATIVE -o build/diktat-x86-probe build/diktat-x86-probe.c geistlib/lib/linux/release/libgeist.a -fopenmp -lm
          python3 benchmarks/quality.py \
            --manifest build/speech-corpus/manifest.json --binary build/diktat-x86-probe \
            --model "$HOME/.local/share/geist-diktat/gemma4-e2b-Q4_K_M.gguf" \
            --tower "$HOME/.local/share/geist-diktat/audio_tower.safetensors" \
            --mel geistlib/audio_test_data/mel_constants.bin --groups de-read-clean --limit 2 --timeout 240 \
            --output build/speech-results/ubuntu-x86-candidate.json
      - name: Export metrics without corpus audio or transcripts
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('quality-metrics');out.mkdir(exist_ok=True)
          for p in Path('build/speech-results').glob('ubuntu*.json'):
              d=json.loads(p.read_text())
              for r in d['runs']:
                  r.pop('transcript',None);r.pop('stderr',None)
              (out/p.name).write_text(json.dumps(d,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-agent-speech-metrics
          path: quality-metrics/
          retention-days: 30
