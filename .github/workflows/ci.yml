name: quality-audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-14 clang-18 llvm-18 make pkg-config libibus-1.0-dev ibus dbus python3 neovim vim ca-certificates libgtk-3-dev qtbase5-dev g++ xvfb xauth xdotool ibus-gtk3
      - name: Pinned engine headers
        run: |
          git clone --quiet https://github.com/geisten/geistlib.git geistlib
          git -C geistlib checkout --detach bb751c596f7d6ed3f73fa2d4c4e29e617cada57f
      - name: Regression contracts and real isolated GTK / Qt / IBus
        run: sh tests/ubuntu.sh
      - name: LLVM core coverage, including failing cases
        if: always()
        env:
          CC: clang-18
          LLVM_COV: llvm-cov-18
          LLVM_PROFDATA: llvm-profdata-18
        run: sh tests/coverage.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-audit-${{ matrix.runner }}
          path: tests/results/
          retention-days: 30
