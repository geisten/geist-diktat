name: package-audit
on:
  workflow_call:
permissions:
  contents: read
jobs:
  clean-ubuntu:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Package build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-14 g++ cmake make pkg-config libibus-1.0-dev dpkg-dev
      - name: Build selected profile and IBus
        run: |
          sh scripts/build-whisper.sh
          make CC=gcc-14 ibus-engine-geist-diktat
          GEIST_PACKAGE_PROFILE=whisper-small VERSION=0.1.0-profiletest sh packaging/build-deb.sh
      - name: Install in a fresh Ubuntu container without developer tools
        run: |
          docker run --rm -v "$PWD:/work:ro" ubuntu:24.04 sh -ec '
            apt-get update -q >/dev/null
            apt-get install -y --no-install-recommends /work/geist-diktat_0.1.0-profiletest_*.deb >/dev/null
            ! command -v gcc
            ! command -v g++
            ! command -v cmake
            ! command -v git
            geist-diktat profile show > /tmp/profile.json
            geist-diktat doctor --json > /tmp/doctor.json && exit 1
            python3 -c '\''import json; p=json.load(open("/tmp/profile.json")); d=json.load(open("/tmp/doctor.json")); assert p["name"]=="whisper-small"; assert [c["name"] for c in d["checks"] if not c["ok"]]==["model"]; assert not d["ready"]'\''
            diktat-whisper /nonexistent.bin </dev/null >/tmp/out 2>/tmp/err && exit 1
            grep -q "model_load failed" /tmp/err
            geist-diktat profile use whisper-small
            grep -q "Permission is hereby granted" /usr/share/doc/geist-diktat/copyright
            grep -q "THE SOFTWARE IS PROVIDED" /usr/share/doc/geist-diktat/copyright
            echo "PASS: selected profile installed and decoder loads on clean Ubuntu; only model data absent"
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-package-${{ matrix.runner }}
          path: geist-diktat_0.1.0-profiletest_*.deb
          retention-days: 30
