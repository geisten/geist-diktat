name: desktop-e2e

# The IBus proof in the REAL session (#3's manual checklist, automated):
# user-local component (~/.local/share/ibus/component — no root), the
# engine's pipeline plays a real WAV through the real diktat binary and
# the real model, and the test client receives the committed transcript
# through the session's own ibus-daemon. No sudo, no uinput.
#
# Note: `ibus restart` briefly (~1 s) restarts the session's input
# method — same action a real user performs when adding the source.

on:
  schedule:
    - cron: "10 4 * * *"
  workflow_dispatch:

jobs:
  ibus-session:
    runs-on: [self-hosted, amd-desktop]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: build diktat (host) + ibus binaries (container — dev headers without sudo)
        run: |
          make CC=gcc-14 TARGET=linux GEMM_PROVIDER=native
          # host has no libibus-1.0-dev and we stay sudo-free: build the two
          # ibus binaries in a container matching the host ABI, run on host.
          . /etc/os-release
          docker run --rm -v "$PWD:/w" -w /w "ubuntu:$VERSION_ID" bash -ec '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q >/dev/null
            apt-get install -y -q gcc make pkg-config libibus-1.0-dev >/dev/null
            make CC=gcc GEMM_PROVIDER=native ibus
            chown '"$(id -u):$(id -g)"' ibus-engine-geist-diktat ibus-test-client
          '
          test -x ./ibus-engine-geist-diktat && test -x ./ibus-test-client
      - name: guard — model + session present
        run: |
          test -f "$HOME/.local/share/geist-diktat/gemma4-e2b-Q4_K_M.gguf" || { echo "model missing (nightly fetches it)"; exit 1; }
          test -S "/run/user/$(id -u)/bus" || { echo "no session bus — is a desktop session running?"; exit 1; }
      - name: install user-local ibus component (both registry paths — version-dependent)
        run: |
          for d in "$HOME/.local/share/ibus/component" "$HOME/.config/ibus/component"; do
            mkdir -p "$d"
            sed "s|/usr/libexec/ibus-engine-geist-diktat|$PWD/ibus-engine-geist-diktat|" \
              ibus/geist-diktat.xml > "$d/geist-diktat.xml"
          done
      - name: e2e — real session, real model, real audio
        run: |
          # adopt the live session's environment (the runner unit has none):
          # DISPLAY/WAYLAND_DISPLAY decide which ibus socket the CLI resolves.
          SPID=$(pgrep -u "$USER" -n gnome-shell || pgrep -u "$USER" -n gnome-session || true)
          test -n "$SPID" || { echo "FAIL: no desktop session process found"; exit 1; }
          for v in DISPLAY WAYLAND_DISPLAY DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR; do
            val=$(tr '\0' '\n' < "/proc/$SPID/environ" | sed -n "s/^$v=//p")
            [ -n "$val" ] && export "$v=$val" && echo "$v=$val"
          done
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          export DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS:-unix:path=/run/user/$(id -u)/bus}"
          export GEIST_AUDIO_MODEL_PATH="$HOME/.local/share/geist-diktat/audio_tower.safetensors"
          export GEIST_MEL_CONSTANTS_PATH="$PWD/geistlib/audio_test_data/mel_constants.bin"
          # The engine pipeline: fixture WAV -> real diktat -> transcript line.
          export GEIST_DIKTAT_CMD="( python3 -c 'import sys, wave; w = wave.open(\"$PWD/tests/fixtures/librispeech-1089-134691-0016.wav\"); sys.stdout.buffer.write(w.readframes(w.getnframes()))'; dd if=/dev/zero bs=32000 count=1 2>/dev/null ) | $PWD/diktat $HOME/.local/share/geist-diktat/gemma4-e2b-Q4_K_M.gguf"
          # the session daemon only scans system component dirs; --replace
          # inherits our IBUS_COMPONENT_PATH while keeping the same session
          # socket (apps reconnect, same as ibus restart)
          export IBUS_COMPONENT_PATH="$HOME/.local/share/ibus/component:/usr/share/ibus/component"
          rm -f "$HOME/.cache/ibus/bus/registry"*   # stale cache wins over a fresh scan
          ibus-daemon --replace --daemonize --panel disable && sleep 3
          for i in $(seq 20); do ibus list-engine 2>/dev/null | grep -q geist-diktat && break; sleep 1; done
          ibus list-engine | grep -q geist-diktat || {
            echo "FAIL: component not registered in the session"
            echo "--- engines seen:"; ibus list-engine 2>&1 | head -5
            echo "--- component dirs:"; ls -la "$HOME/.local/share/ibus/component" "$HOME/.config/ibus/component" 2>&1
            echo "--- registry cache:"; ls -la "$HOME/.cache/ibus/bus/" 2>&1 | head -4
            echo "--- ibus version:"; ibus version 2>&1
            echo "--- daemon env support:"; strings /usr/bin/ibus-daemon 2>/dev/null | grep -i component | head -4
            echo "--- daemon procs:"; pgrep -af ibus-daemon | head -3
            exit 1
          }
          # select the engine globally too (what Super+Space does) — in a real
          # session gnome-shell owns engine selection and may override the
          # client's per-context choice
          ibus engine geist-diktat || true
          sleep 2
          echo "--- global engine now: $(ibus engine 2>/dev/null)"
          OUT=$(timeout 120 ./ibus-test-client) || {
            echo "FAIL: no commit received"
            echo "--- engine proc:"; pgrep -af ibus-engine-geist-diktat || echo "(engine never spawned)"
            echo "--- pipeline proc:"; pgrep -af "diktat .*gguf" || echo "(pipeline not running)"
            echo "--- global engine after: $(ibus engine 2>/dev/null)"
            exit 1
          }
          echo "committed: $OUT"
          echo "$OUT" | grep -qi "voyaging across the deserts" || { echo "FAIL: transcript mismatch"; exit 1; }
          echo "PASS: real-session IBus dictation delivered the real transcript"
      - name: cleanup — remove test component, restore session ibus
        if: always()
        run: |
          rm -f "$HOME/.local/share/ibus/component/geist-diktat.xml" "$HOME/.config/ibus/component/geist-diktat.xml"
          # adopt the live session's environment (the runner unit has none):
          # DISPLAY/WAYLAND_DISPLAY decide which ibus socket the CLI resolves.
          SPID=$(pgrep -u "$USER" -n gnome-shell || pgrep -u "$USER" -n gnome-session || true)
          test -n "$SPID" || { echo "FAIL: no desktop session process found"; exit 1; }
          for v in DISPLAY WAYLAND_DISPLAY DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR; do
            val=$(tr '\0' '\n' < "/proc/$SPID/environ" | sed -n "s/^$v=//p")
            [ -n "$val" ] && export "$v=$val" && echo "$v=$val"
          done
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          export DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS:-unix:path=/run/user/$(id -u)/bus}"
          ibus-daemon --replace --daemonize || true
