name: nightly-e2e

# The one job that HEARS: real model + real audio through the packaged
# pipeline, scored against a reference transcript. Not per-PR — the
# fixtures are 3.7 GB (cached; the model is SHA-pinned and never changes,
# so the cache key is static).

on:
  schedule:
    - cron: "20 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    # org runner (amd box): the 3.7 GB fixtures live on its NVMe — no
    # actions-cache dance, warm runs start immediately.
    runs-on: [self-hosted, amd-desktop]
    steps:
      - uses: actions/checkout@v4
      # Build first: the tower fetcher below lives in geistlib/tools/, and the
      # engine checkout is created by make (GEIST_REF), no longer by a submodule.
      - name: build (also clones the pinned engine)
        run: make CC=gcc-14 TARGET=linux GEMM_PROVIDER=native
      - name: fetch model + tower (idempotent, SHA-gated)
        run: |
          DATA="$HOME/.local/share/geist-diktat"
          mkdir -p "$DATA"
          if ! echo "740185b21d22ceb83a11c3aa62ad5842ef32c70f6096d756bbee85a1e4ec34b8  $DATA/gemma4-e2b-Q4_K_M.gguf" | sha256sum -c - 2>/dev/null; then
            curl -fL --retry 3 -C - -o "$DATA/gemma4-e2b-Q4_K_M.gguf" \
              "https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-Q4_K_M.gguf"
            echo "740185b21d22ceb83a11c3aa62ad5842ef32c70f6096d756bbee85a1e4ec34b8  $DATA/gemma4-e2b-Q4_K_M.gguf" | sha256sum -c -
          fi
          python3 geistlib/tools/fetch_audio_tower.py -o "$DATA/audio_tower.safetensors" \
            --sha256 d6c45a6c276212dc3a793e66dfc588d89c12d1ac92c0e4b85494390ca848cd77
      - name: e2e — transcribe the LibriSpeech fixture, gate on WER
        run: sh tests/e2e_wer.sh
