name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to package (without v), e.g. 0.1.0"
        required: true

permissions:
  contents: write

jobs:
  artifacts:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: version from tag
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: deps
        run: sudo apt-get update -q && sudo apt-get install -y -q lintian
      # arm64 builds in debian:12 with clang-19: the Pi world runs RasPiOS
      # bookworm (glibc 2.36); ubuntu-24.04 binaries link libmvec +
      # GLIBC_2.38+ symbols and die there (measured on a Pi 5). amd64
      # stays on the runner's gcc-14 (clang-19 backend-crashes on the
      # x86 VNNI kernels; x86 desktops run ubuntu 24.04+ / debian 13+).
      - name: build (arm64 -> debian:12 + clang-19; amd64 -> gcc-14)
        run: |
          if [ "$(uname -m)" = aarch64 ]; then
            docker run --rm -v "$PWD:/w" -w /w debian:12 bash -ec '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -q >/dev/null
              apt-get install -y -q clang-19 libomp-19-dev libibus-1.0-dev make pkg-config >/dev/null
              make CC=clang-19 TARGET=linux GEMM_PROVIDER=native
              make CC=clang-19 GEMM_PROVIDER=native ibus-engine-geist-diktat
            '
          else
            sudo apt-get install -y -q gcc-14 libibus-1.0-dev
            make CC=gcc-14 TARGET=linux GEMM_PROVIDER=native
            make CC=gcc-14 GEMM_PROVIDER=native ibus-engine-geist-diktat
          fi
      - name: package
        run: |
          VERSION=${{ steps.v.outputs.version }} sh packaging/build-deb.sh
          VERSION=${{ steps.v.outputs.version }} sh packaging/build-tarball.sh
      - name: lintian
        run: lintian --fail-on error geist-diktat_*.deb
      - name: install sanity against the release artifact
        run: |
          sudo apt-get install -y -q ./geist-diktat_*.deb
          geist-diktat 2>&1 | grep -q usage
          diktat /nonexistent.gguf </dev/null 2>&1 | grep -q "model_load failed"
          ls /usr/share/ibus/component/geist-diktat.xml /usr/libexec/ibus-engine-geist-diktat
      - name: tarball sanity (wrapper resolves its unpacked prefix)
        run: |
          mkdir -p /tmp/tb && tar -C /tmp/tb -xzf geist-diktat_*_linux-*.tar.gz
          /tmp/tb/geist-diktat_*/bin/geist-diktat 2>&1 | grep -q usage
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            geist-diktat_*.deb
            geist-diktat_*_linux-*.tar.gz

  macos-tarball:
    # Apple Silicon only: geistlib's mac targets build the cpu_neon
    # backend, so there is no Intel Mac build to ship.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: version from tag
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      # The image default is Xcode 16.4, whose Apple clang only knows
      # -std=c2x; geistlib builds with -std=c23. Pick the newest Xcode on
      # the image rather than pinning a version that ages out.
      - name: select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: deps
        run: brew install libomp
      # GEIST_STATIC_OMP=1 is not optional here: without it the binary
      # hard-links Homebrew's libomp.dylib and the tarball is broken on
      # any Mac without it. build-tarball.sh fails the build if that
      # regresses.
      - name: build (static libomp)
        run: make GEIST_STATIC_OMP=1
      - name: smoke test (fixture-gated half skips without the model)
        run: sh tests/smoke.sh
      - name: package
        run: VERSION=${{ steps.v.outputs.version }} sh packaging/build-tarball.sh
      - name: tarball sanity (wrapper resolves its unpacked prefix)
        run: |
          mkdir -p /tmp/tb && tar -C /tmp/tb -xzf geist-diktat_*_macos-*.tar.gz
          /tmp/tb/geist-diktat_*/bin/geist-diktat 2>&1 | grep -q usage
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: geist-diktat_*_macos-*.tar.gz

  publish:
    needs: [artifacts, macos-tarball]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: stable-name aliases (README links releases/latest/download/geist-diktat_<arch>.deb)
        run: |
          for a in amd64 arm64; do
            cp geist-diktat_*_"$a".deb "geist-diktat_$a.deb"
          done
          # geist-diktat_0.1.3_macos-arm64.tar.gz -> geist-diktat_macos-arm64.tar.gz
          for f in geist-diktat_*_linux-*.tar.gz geist-diktat_*_macos-*.tar.gz; do
            [ -e "$f" ] || continue
            cp "$f" "geist-diktat_${f#geist-diktat_*_}"
          done
      - name: SHA256SUMS (install.sh verifies every asset against it)
        run: sha256sum geist-diktat_*.deb geist-diktat_*.tar.gz > SHA256SUMS
      - name: create release with all artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            geist-diktat_*.deb geist-diktat_*.tar.gz SHA256SUMS
