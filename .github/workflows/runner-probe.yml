name: runner-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: self-hosted
    steps:
      - name: environment inventory
        run: |
          echo "=== cpu ==="; lscpu | grep -E "Model name|avx512" | head -4
          echo "=== mem/disk ==="; free -h | head -2; df -h "$HOME" | tail -1
          echo "=== os ==="; head -2 /etc/os-release; uname -r
          echo "=== tools ==="; for t in docker gcc-14 clang make ydotool ibus-daemon arecord pactl; do printf "%s: " "$t"; command -v $t || echo MISSING; done
          echo "=== docker perms ==="; docker info >/dev/null 2>&1 && echo ok || echo "no access"
          echo "=== session ==="; echo "WAYLAND_DISPLAY=$WAYLAND_DISPLAY DISPLAY=$DISPLAY XDG_SESSION_TYPE=$XDG_SESSION_TYPE"
          loginctl list-sessions --no-legend 2>/dev/null | head -3
          echo "=== groups ==="; id -nG
